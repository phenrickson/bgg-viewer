name: viewer artifacts

# Rebuild the in-browser artifacts and publish them to GCS.
#
# Both artifacts come from the same warehouse tables and change on the same cadence, so they
# share one run: one checkout, one auth, one install, a build step each.
#
# Triggered by the warehouse pipeline finishing (bgg-data-warehouse's dataform.yml dispatches
# `catalog_refresh` from its terminal `embeddings_complete` branch), because that is when the
# data actually changes — once a day, not every six hours as the old in-process TTL guessed.
#
# The dispatch type stays `catalog_refresh` even though this now publishes more than the
# catalog: it is sent from another repo, so renaming it would need a coordinated merge on
# both sides to buy nothing.
#
# `workflow_dispatch` is here so the artifacts can be rebuilt by hand: useful for the first
# run, when the bucket is empty and nothing has dispatched yet, and for recovering from a
# missed pipeline run without waiting a day.
on:
  repository_dispatch:
    types: [catalog_refresh]
  workflow_dispatch:

# Two pipeline runs finishing close together would otherwise race to write the pointer.
# Not cancel-in-progress: a half-finished run has already uploaded an artifact, and letting
# it finish writing its pointer is harmless (the object is content-hashed either way).
concurrency:
  group: viewer-artifacts
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: bgg-data-warehouse

jobs:
  build:
    name: Build and upload viewer artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BGG_DW }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      # tsx rather than plain node: the script reuses `columns.ts` and `serialize.ts` so the
      # query and the Arrow schema keep coming from one definition. See the script's header.
      #
      # `dlx` (fetch on demand), NOT a devDependency. Adding tsx to package.json satisfies one
      # of vite's OPTIONAL PEER dependencies (esbuild, jiti, tsx, yaml), which re-resolves
      # vite's whole peer set and drags esbuild@0.28.2 into the lockfile. esbuild ships a
      # postinstall script, pnpm refuses to run unapproved build scripts and exits non-zero,
      # and the Dockerfile's `pnpm install --frozen-lockfile --prod` then fails — so the image
      # never builds and the deploy dies. This is CI-only tooling; it has no business in the
      # runtime dependency graph.
      # Catalog first: it is the one artifact in the user's critical path. A thumbnails
      # failure then fails the run *after* the catalog pointer has already landed, and it
      # fails loudly rather than being swallowed by continue-on-error.
      - name: Build and upload catalog
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
        run: pnpm dlx tsx@4 scripts/build-catalog-artifact.ts

      - name: Build and upload thumbnails
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
        run: pnpm dlx tsx@4 scripts/build-thumbnails-artifact.ts
